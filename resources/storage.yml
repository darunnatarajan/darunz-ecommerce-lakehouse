# Unity Catalog objects owned by this project.
# Everything downstream references these resources (not hard-coded names),
# so dev-mode name prefixes are handled automatically.

resources:
  schemas:
    ecommerce:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Darunz e-commerce lakehouse (Bronze / Silver / Gold)

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.ecommerce.name}
      name: landing
      volume_type: MANAGED
      comment: Raw landing zone — the data generator drops JSON/CSV files here
